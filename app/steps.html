<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قدم‌های روزانه | همراه مدیریت کارها</title><link rel="stylesheet" href="shared.css"></head>
<body><main>
<header class="top"><div><h1>قدم‌های روزانه</h1><p class="subtitle">اقدام‌های اتمی با ترتیب، موعد، وابستگی و نشانهٔ پایان.</p></div><p id="source" class="source">در حال خواندن STEPS.md…</p></header>
<section class="panel"><div class="filters"><label>جست‌وجو<input id="search" type="search" placeholder="قدم، تسک یا شناسه"></label><label>بازه<select id="range"><option value="open">قدم‌های باز</option><option value="today">امروز</option><option value="week">۷ روز آینده</option><option value="all">همهٔ قدم‌ها</option></select></label><label>وضعیت<select id="status"><option value="">همهٔ وضعیت‌ها</option></select></label><label>اولویت<select id="priority"><option value="">همهٔ اولویت‌ها</option></select></label><button id="reload" type="button">به‌روزرسانی</button></div><div id="stats" class="stats" aria-live="polite"></div></section>
<div id="error" class="error" hidden></div><div id="empty" class="empty" hidden>قدمی با این فیلترها پیدا نشد.</div><div id="content"></div>
<p class="foot">قدم‌ها در STEPS.md می‌مانند. انجامشان از راه گفت‌وگو با Agent ثبت و در تاریخچه زمان‌دار می‌شود.</p>
</main><script src="shared.js"></script><script>
(()=>{const A=window.TaskApp,cols=["شناسهٔ قدم","شناسهٔ تسک","ترتیب","قدم اتمی","اولویت","موعد","وضعیت","وابسته به","نشانهٔ پایان"],byId=id=>document.getElementById(id);let steps=[],tasks=[];A.nav("steps");
function fill(id,key,label){const s=byId(id),cur=s.value;s.replaceChildren(new Option(label,""));[...new Set(steps.map(x=>x[key]).filter(x=>x&&x!=="—"))].sort((a,b)=>a.localeCompare(b,"fa")).forEach(v=>s.add(new Option(v,v)));if([...s.options].some(o=>o.value===cur))s.value=cur;}
function filtered(){const q=A.normalize(byId("search").value),range=byId("range").value,status=byId("status").value,priority=byId("priority").value,now=A.today(),end=new Date(now);end.setDate(end.getDate()+7);return steps.filter(s=>{const open=!["انجام‌شده","کنارگذاشته‌شده"].includes(s["وضعیت"]),d=A.dateValue(s["موعد"]);if(range==="open"&&!open)return false;if(range==="today"&&(!d||d<now||d>now||!open))return false;if(range==="week"&&(!d||d<now||d>end||!open))return false;if(status&&s["وضعیت"]!==status)return false;if(priority&&s["اولویت"]!==priority)return false;if(q&&!A.normalize(cols.map(k=>s[k]).join(" ")+" "+(tasks.find(t=>t["شناسه"]===s["شناسهٔ تسک"])?.["عنوان"]||"")).includes(q))return false;return true;}).sort((a,b)=>{const da=A.dateValue(a["موعد"]),db=A.dateValue(b["موعد"]);if(da&&!db)return -1;if(!da&&db)return 1;if(da&&db&&da-db)return da-db;return a["شناسهٔ تسک"].localeCompare(b["شناسهٔ تسک"])||Number(a["ترتیب"])-Number(b["ترتیب"]);});}
function render(){const content=byId("content");content.replaceChildren();const list=filtered(),groups=new Map();for(const s of list){if(!groups.has(s["شناسهٔ تسک"]))groups.set(s["شناسهٔ تسک"],[]);groups.get(s["شناسهٔ تسک"]).push(s);}for(const[id,items]of groups){const task=tasks.find(t=>t["شناسه"]===id),section=document.createElement("section");section.className="group";const h=document.createElement("h2");h.textContent=id+" — "+(task?.["عنوان"]||"عنوان تسک پیدا نشد");section.append(h);if(task?.["توضیحات"]&&task["توضیحات"]!=="—"){const detail=document.createElement("p");detail.className="step-meta";detail.textContent=task["توضیحات"];section.append(detail);}const grid=document.createElement("div");grid.className="step-list";for(const s of items){const card=document.createElement("article");card.className="step-card";const head=document.createElement("div");head.className="step-head";const title=document.createElement("h3");title.textContent=s["ترتیب"]+". "+s["قدم اتمی"];const tags=document.createElement("div");tags.append(A.badge(s["اولویت"],"priority"),document.createTextNode(" "),A.badge(s["وضعیت"],"status"));head.append(title,tags);card.append(head);const meta=document.createElement("div");meta.className="step-meta";meta.textContent=s["شناسهٔ قدم"]+" · موعد: "+s["موعد"]+" · وابسته به: "+s["وابسته به"];card.append(meta);const done=document.createElement("p");done.textContent="نشانهٔ پایان: "+s["نشانهٔ پایان"];card.append(done);grid.append(card);}section.append(grid);content.append(section);}const open=steps.filter(s=>!["انجام‌شده","کنارگذاشته‌شده"].includes(s["وضعیت"])).length;byId("stats").textContent="نمایش "+list.length+" قدم · قدم باز در کل: "+open;byId("empty").hidden=list.length>0;}
async function load(){byId("error").hidden=true;try{[steps,tasks]=await Promise.all([A.read("../STEPS.md").then(x=>A.parseTable(x,cols)),A.read("../TASKS.md").then(x=>A.parseTable(x,["شناسه","عنوان","اولویت","موعد","وضعیت","پروژه","خلاصهٔ قدم بعدی","دلیل اولویت","توضیحات"]))]);fill("status","وضعیت","همهٔ وضعیت‌ها");fill("priority","اولویت","همهٔ اولویت‌ها");byId("source").textContent="منابع: STEPS.md و TASKS.md";render();}catch(e){A.showError(e);}}["search","range","status","priority"].forEach(id=>byId(id).addEventListener("input",render));byId("reload").addEventListener("click",load);load();})();
</script></body></html>

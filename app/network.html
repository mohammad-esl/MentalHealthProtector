<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>شبکهٔ افراد | همراه مدیریت کارها</title><link rel="stylesheet" href="shared.css"></head>
<body><main>
<header class="top"><div><h1>شبکهٔ افراد و پروژه‌ها</h1><p class="subtitle">فقط رابطه‌های ثبت‌شده با مبنای روشن در این نمودار می‌آیند.</p></div><p id="source" class="source">در حال خواندن PEOPLE.md…</p></header>
<section class="panel"><div class="filters"><label>جست‌وجو<input id="search" type="search" placeholder="نام، رابطه یا مبنا"></label><label>پروژه<select id="project"><option value="">همهٔ پروژه‌ها</option></select></label><button id="reload" type="button">به‌روزرسانی</button></div><div class="legend"><span>فرد</span><span class="project">پروژه</span></div><div id="stats" class="stats" aria-live="polite"></div></section>
<div id="error" class="error" hidden></div><section class="panel"><div id="empty" class="empty" hidden>رابطه‌ای با این جست‌وجو پیدا نشد.</div><div class="network-wrap"><svg id="graph" class="network-svg" role="img" aria-label="نمودار روابط افراد و پروژه‌ها"></svg></div></section>
<section class="panel"><h2>مبنای رابطه‌ها</h2><p class="subtitle">این جدول امکان بازبینی جزئیات و منبع هر پیوند را می‌دهد.</p><div class="table-wrap"><table><thead><tr><th>مبدأ</th><th>نوع رابطه</th><th>مقصد</th><th>پروژه</th><th>مبنا</th></tr></thead><tbody id="relations"></tbody></table></div></section>
</main><script src="shared.js"></script><script>
(()=>{const A=window.TaskApp,byId=id=>document.getElementById(id);let people=[],projects=[],relations=[];A.nav("network");function value(id){return id.replace(/\s+/g,"");}function nodeName(id){return [...people,...projects].find(n=>n["شناسه"]===id)?.["نام نمایشی"]||[...people,...projects].find(n=>n["شناسه"]===id)?.["نام پروژه یا موضوع"]||id;}function fillProjects(){const select=byId("project"),cur=select.value;select.replaceChildren(new Option("همهٔ پروژه‌ها",""));projects.forEach(p=>select.add(new Option(p["نام پروژه یا موضوع"],p["شناسه"])));if([...select.options].some(o=>o.value===cur))select.value=cur;}
function filtered(){const q=A.normalize(byId("search").value),project=byId("project").value;return relations.filter(r=>{if(project&&r["پروژه"]!==project)return false;const all=[nodeName(r["مبدأ"]),r["نوع رابطه"],nodeName(r["مقصد"]),r["مبنا"]].join(" ");return !q||A.normalize(all).includes(q);});}
function render(){const edges=filtered(),svg=byId("graph");svg.replaceChildren();const ns="http://www.w3.org/2000/svg",width=1100,personX=220,projectX=850,personGap=88,projectGap=112,height=Math.max(420,Math.max(people.length*personGap,projects.length*projectGap)+100);svg.setAttribute("viewBox",`0 0 ${width} ${height}`);const defs=document.createElementNS(ns,"defs"),marker=document.createElementNS(ns,"marker");marker.id="arrow";marker.setAttribute("markerWidth","8");marker.setAttribute("markerHeight","8");marker.setAttribute("refX","7");marker.setAttribute("refY","3");marker.setAttribute("orient","auto");marker.setAttribute("markerUnits","strokeWidth");const tip=document.createElementNS(ns,"path");tip.setAttribute("d","M0,0 L0,6 L8,3 z");tip.setAttribute("fill","#9aadc0");marker.append(tip);defs.append(marker);svg.append(defs);
const involved=new Set();edges.forEach(e=>{involved.add(e["مبدأ"]);involved.add(e["مقصد"]);});const pfiltered=people.filter(p=>involved.has(p["شناسه"])),prfiltered=projects.filter(p=>involved.has(p["شناسه"]));const pos=new Map();pfiltered.forEach((p,i)=>pos.set(p["شناسه"],{x:personX,y:55+i*personGap,type:"person",name:p["نام نمایشی"]}));prfiltered.forEach((p,i)=>pos.set(p["شناسه"],{x:projectX,y:55+i*projectGap,type:"project",name:p["نام پروژه یا موضوع"]}));
for(const e of edges){const a=pos.get(e["مبدأ"]),b=pos.get(e["مقصد"]);if(!a||!b)continue;const path=document.createElementNS(ns,"path");path.setAttribute("class","edge");if(a.type===b.type){const x=Math.min(a.x,b.x)+115;path.setAttribute("d",`M ${a.x+90} ${a.y+20} Q ${x} ${(a.y+b.y)/2+25} ${b.x+90} ${b.y+20}`);}else{path.setAttribute("d",`M ${a.x+90} ${a.y+20} C 475 ${a.y+20}, 580 ${b.y+20}, ${b.x-105} ${b.y+20}`);}path.setAttribute("marker-end","url(#arrow)");svg.append(path);const label=document.createElementNS(ns,"text");label.setAttribute("class","edge-label");label.setAttribute("text-anchor","middle");label.setAttribute("x",a.type===b.type?Math.min(a.x,b.x)+235:535);label.setAttribute("y",(a.y+b.y)/2+15);label.textContent=e["نوع رابطه"];svg.append(label);}
for(const[id,p]of pos){const group=document.createElementNS(ns,"g");const rect=document.createElementNS(ns,"rect");rect.setAttribute("x",p.x-(p.type==="person"?88:105));rect.setAttribute("y",p.y);rect.setAttribute("width",p.type==="person"?176:210);rect.setAttribute("height","42");rect.setAttribute("rx",p.type==="person"?20:8);rect.setAttribute("class",p.type==="person"?"node-person":"node-project");const name=document.createElementNS(ns,"text");name.setAttribute("class","node-label");name.setAttribute("x",p.x);name.setAttribute("y",p.y+19);name.setAttribute("text-anchor","middle");name.textContent=p.name;const kind=document.createElementNS(ns,"text");kind.setAttribute("class","node-kind");kind.setAttribute("x",p.x);kind.setAttribute("y",p.y+34);kind.setAttribute("text-anchor","middle");kind.textContent=p.type==="person"?id:"پروژه";group.append(rect,name,kind);svg.append(group);}
const tbody=byId("relations");tbody.replaceChildren();for(const e of edges){const tr=document.createElement("tr");[nodeName(e["مبدأ"]),e["نوع رابطه"],nodeName(e["مقصد"]),nodeName(e["پروژه"]),e["مبنا"]].forEach(v=>A.cell(tr,v));tbody.append(tr);}byId("empty").hidden=edges.length>0;byId("stats").textContent="افراد در نمودار: "+pfiltered.length+" · پروژه‌ها: "+prfiltered.length+" · رابطه‌های مستند: "+edges.length;}
async function load(){byId("error").hidden=true;try{const text=await A.read("../PEOPLE.md");[people,projects,relations]=[A.parseTable(text,["شناسه","نام نمایشی","نقش یا وصفِ گفته‌شده"]),A.parseTable(text,["شناسه","نام پروژه یا موضوع"]),A.parseTable(text,["مبدأ","نوع رابطه","مقصد","پروژه","مبنا"])];fillProjects();byId("source").textContent="منبع: PEOPLE.md";render();}catch(e){A.showError(e);}}
byId("search").addEventListener("input",render);byId("project").addEventListener("change",render);byId("reload").addEventListener("click",load);load();})();
</script></body></html>
